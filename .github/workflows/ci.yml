name: CI

on:
  push:
  pull_request:

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: python tools/check_manifest.py
      - run: python tools/build_problem_coverage.py --check
      - run: python tools/check_problem_docs.py
      - run: python tools/coverage_report.py
      - run: python tools/check_results.py results/verified/2026-07-26-implemented.json
      - run: python tools/check_domain_results.py results/verified/2026-07-27-domain.json
      - run: python -m pytest

  pythtb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[pythtb]"
      - run: python backends/pythtb/run.py bulk_graphene_dirac_cone
      - run: python backends/pythtb/run.py bulk_ssh_polarization
      - run: python backends/pythtb/run.py bulk_rice_mele_pump
      - run: python backends/pythtb/run.py bulk_haldane_chern_transition
      - run: python backends/pythtb/run.py bulk_qwz_phase_diagram
      - run: python backends/pythtb/run.py bulk_kane_mele_z2
      - run: python backends/pythtb/run.py bulk_kagome_soc_chern
      - run: python backends/pythtb/run.py bulk_bbh_nested_wilson
      - run: python backends/pythtb/run.py bulk_weyl_chirality
      - run: python backends/pythtb/run.py bulk_nodal_line_berry_phase
      - run: python backends/pythtb/run.py bulk_tilted_dirac_berry_dipole
      - run: python backends/pythtb/run.py bulk_wannier_interpolation
      - run: python backends/pythtb/run.py boundary_ssh_edge_localization
      - run: python backends/pythtb/run.py boundary_haldane_ribbon_flow
      - run: python backends/pythtb/run.py boundary_graphene_terminations
      - run: python backends/pythtb/run.py boundary_bbh_corner_modes
      - run: python backends/pythtb/run.py domain_spectral_reliability
      - run: python backends/pythtb/run.py domain_magnetic_hofstadter
      - run: python backends/pythtb/run.py domain_bdg_majorana
      - run: python backends/pythtb/run.py domain_spin_texture_covariance

  kwant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update
      - run: sudo apt-get install -y g++ gfortran libopenblas-dev
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements/kwant-build.txt
      - run: python -m pip install --no-build-isolation tinyarray==1.2.5 kwant==1.5.0
      - run: python -m pip install -e . --no-deps
      - run: python backends/kwant/run.py bulk_graphene_dirac_cone
      - run: python backends/kwant/run.py bulk_ssh_polarization
      - run: python backends/kwant/run.py bulk_rice_mele_pump
      - run: python backends/kwant/run.py bulk_haldane_chern_transition
      - run: python backends/kwant/run.py bulk_qwz_phase_diagram
      - run: python backends/kwant/run.py bulk_kane_mele_z2
      - run: python backends/kwant/run.py bulk_kagome_soc_chern
      - run: python backends/kwant/run.py bulk_bbh_nested_wilson
      - run: python backends/kwant/run.py bulk_weyl_chirality
      - run: python backends/kwant/run.py bulk_nodal_line_berry_phase
      - run: python backends/kwant/run.py bulk_tilted_dirac_berry_dipole
      - run: python backends/kwant/run.py boundary_ssh_edge_localization
      - run: python backends/kwant/run.py boundary_haldane_ribbon_flow
      - run: python backends/kwant/run.py boundary_graphene_terminations
      - run: python backends/kwant/run.py boundary_bbh_corner_modes
      - run: python backends/kwant/run.py transport_ballistic_chain
      - run: python backends/kwant/run.py transport_resonant_level
      - run: python backends/kwant/run.py transport_aharonov_bohm_ring
      - run: python backends/kwant/run.py transport_quantum_hall_strip
      - run: python backends/kwant/run.py domain_spectral_reliability
      - run: python backends/kwant/run.py domain_magnetic_hofstadter
      - run: python backends/kwant/run.py domain_bdg_majorana
      - run: python backends/kwant/run.py domain_lead_calibration
      - run: python backends/kwant/run.py domain_spin_texture_covariance

  thouless:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - run: cargo run --quiet --release --manifest-path backends/thouless/Cargo.toml -- bulk_graphene_dirac_cone
      - run: cargo run --quiet --release --manifest-path backends/thouless/Cargo.toml -- bulk_ssh_polarization
      - run: cargo run --quiet --release --manifest-path backends/thouless/Cargo.toml -- bulk_rice_mele_pump
      - run: cargo run --quiet --release --manifest-path backends/thouless/Cargo.toml -- bulk_haldane_chern_transition
      - run: cargo run --quiet --release --manifest-path backends/thouless/Cargo.toml -- bulk_qwz_phase_diagram
      - run: cargo run --quiet --release --manifest-path backends/thouless/Cargo.toml -- bulk_kane_mele_z2
      - run: cargo run --quiet --release --manifest-path backends/thouless/Cargo.toml -- bulk_kagome_soc_chern
      - run: cargo run --quiet --release --manifest-path backends/thouless/Cargo.toml -- bulk_bbh_nested_wilson
      - run: cargo run --quiet --release --manifest-path backends/thouless/Cargo.toml -- bulk_weyl_chirality
      - run: cargo run --quiet --release --manifest-path backends/thouless/Cargo.toml -- bulk_nodal_line_berry_phase
      - run: cargo run --quiet --release --manifest-path backends/thouless/Cargo.toml -- bulk_tilted_dirac_berry_dipole
      - run: cargo run --quiet --release --manifest-path backends/thouless/Cargo.toml -- bulk_wannier_interpolation
      - run: cargo run --quiet --release --manifest-path backends/thouless/Cargo.toml -- boundary_ssh_edge_localization
      - run: cargo run --quiet --release --manifest-path backends/thouless/Cargo.toml -- boundary_haldane_ribbon_flow
      - run: cargo run --quiet --release --manifest-path backends/thouless/Cargo.toml -- boundary_graphene_terminations
      - run: cargo run --quiet --release --manifest-path backends/thouless/Cargo.toml -- boundary_bbh_corner_modes
      - run: cargo run --quiet --release --manifest-path backends/thouless/Cargo.toml -- transport_ballistic_chain
      - run: cargo run --quiet --release --manifest-path backends/thouless/Cargo.toml -- transport_resonant_level
      - run: cargo run --quiet --release --manifest-path backends/thouless/Cargo.toml -- transport_aharonov_bohm_ring
      - run: cargo run --quiet --release --manifest-path backends/thouless/Cargo.toml -- transport_quantum_hall_strip
      - run: cargo run --quiet --release --manifest-path backends/thouless/Cargo.toml -- domain_spectral_reliability
      - run: cargo run --quiet --release --manifest-path backends/thouless/Cargo.toml -- domain_magnetic_hofstadter
      - run: cargo run --quiet --release --manifest-path backends/thouless/Cargo.toml -- domain_bdg_majorana
      - run: cargo run --quiet --release --manifest-path backends/thouless/Cargo.toml -- domain_lead_calibration
      - run: cargo run --quiet --release --manifest-path backends/thouless/Cargo.toml -- domain_spin_texture_covariance
