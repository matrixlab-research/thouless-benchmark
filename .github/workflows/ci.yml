name: CI

on:
  push:
  pull_request:

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: python tools/check_manifest.py
      - run: python tools/coverage_report.py
      - run: python tools/check_results.py results/verified/2026-07-26-seed.json
      - run: python -m pytest

  pythtb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[pythtb]"
      - run: python backends/pythtb/run.py bulk_graphene_dirac_cone
      - run: python backends/pythtb/run.py bulk_ssh_polarization
      - run: python backends/pythtb/run.py boundary_ssh_edge_localization

  kwant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update
      - run: sudo apt-get install -y g++ gfortran libopenblas-dev
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements/kwant-build.txt
      - run: python -m pip install --no-build-isolation tinyarray==1.2.5 kwant==1.5.0
      - run: python -m pip install -e . --no-deps
      - run: python backends/kwant/run.py bulk_graphene_dirac_cone
      - run: python backends/kwant/run.py bulk_ssh_polarization
      - run: python backends/kwant/run.py boundary_ssh_edge_localization
      - run: python backends/kwant/run.py transport_ballistic_chain

  thouless:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - run: cargo run --quiet --release --manifest-path backends/thouless/Cargo.toml -- bulk_graphene_dirac_cone
      - run: cargo run --quiet --release --manifest-path backends/thouless/Cargo.toml -- bulk_ssh_polarization
      - run: cargo run --quiet --release --manifest-path backends/thouless/Cargo.toml -- boundary_ssh_edge_localization
      - run: cargo run --quiet --release --manifest-path backends/thouless/Cargo.toml -- transport_ballistic_chain
