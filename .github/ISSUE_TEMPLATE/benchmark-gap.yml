name: Benchmark implementation gap
description: Track an implementable-unverified problem or a missing package capability.
title: "Implement: "
labels:
  - benchmark-gap
body:
  - type: input
    id: cases
    attributes:
      label: Problem or case identifiers
      description: Exact TBQ identifiers or case identifiers from the benchmark manifests.
    validations:
      required: true
  - type: dropdown
    id: assessment
    attributes:
      label: Current assessment
      options:
        - implementable_unverified
        - missing_capability
    validations:
      required: true
  - type: checkboxes
    id: backends
    attributes:
      label: Applicable backends
      options:
        - label: Native Thouless Rust
        - label: Original PythTB 2.0.0
        - label: Original Kwant 1.5.0
  - type: textarea
    id: observable
    attributes:
      label: Scientific observable and reference
      description: State the computed observable, analytic invariant or metamorphic reference, and tolerance.
    validations:
      required: true
  - type: textarea
    id: capabilities
    attributes:
      label: Required and missing capabilities
      description: Copy the required and missing capability identifiers from benchmark/problem_coverage.json.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Completion evidence
      value: |
        - [ ] Uses the native or original backend, not a compatibility substitute
        - [ ] Exercises the documented parameter range and required scale
        - [ ] Scientific checks pass
        - [ ] Cross-backend comparison is recorded where applicable
        - [ ] A verified result record is committed
        - [ ] The relevant implementation manifest and problem audit are updated
        - [ ] CI is updated
    validations:
      required: true
