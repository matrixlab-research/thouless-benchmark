<title id="chart-title">Native AD versus central finite differences</title>
<desc id="chart-desc">Overlaid horizontal bars compare native automatic differentiation and central finite differences for ten scientific workflows on a logarithmic time axis. Each row reports the same-machine median times and finite-difference over AD speedup.</desc>
<rect width="100%" height="100%" rx="12" fill="#ffffff"/>
